[project]
name = "travel-notification-system"
version = "0.1.0"
description = "Backend modular skeleton for itinerary notification and butler workflow"
requires-python = ">=3.11"
dependencies = [
  "pymysql>=1.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["everything-claude-code", "frontend/node_modules", ".venv", "dist", "build"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
