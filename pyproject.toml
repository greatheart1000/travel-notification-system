[project]
name = "travel-notification-system"
version = "0.1.0"
description = "Backend modular skeleton for itinerary notification and butler workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pymysql>=1.1.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["everything-claude-code", "frontend/node_modules", ".venv", "dist", "build"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
