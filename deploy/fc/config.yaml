# 阿里云 FC 部署前端配置

# 使用前替换为实际的 FC 函数域名
FC_API_BASE_URL=https://your-function-id.cn-hangzhou.fcapp.run

# 在 FC 控制台设置的环境变量
ENV_VARS:
  变量名                                      值                                 说明
  ──────────────────────────────────────────────────────────────────────────────────
  TRAVEL_NOTIFICATION_PERSISTENCE_BACKEND    json                              使用 JSON 文件存储（serverless 无状态）
  TRAVEL_NOTIFICATION_DB_DIR                /tmp/travel-data                   数据文件存储目录（/tmp 是 FC 可写目录）
  TRAVEL_NOTIFICATION_CORS_ORIGINS           https://your-bucket.oss-cn-xxx.aliyuncs.com  允许的前端域名（逗号分隔）
  PYTHONPATH                                 /code/src                          Python 模块搜索路径

# FC 函数配置
FUNCTION_CONFIG:
  运行时:      自定义运行时 (custom) 或 Python 3.10
  内存:        512 MB 起步（FastAPI 建议 1GB）
  超时时间:    120 秒
  实例并发度:  10-100
  触发器:      HTTP 触发器（认证方式: 无需认证 或 JWT）

# OSS 前端部署
FRONTEND_OSS:
  Bucket:      创建公共读 Bucket
  托管:        开启静态网站托管
  首页:        index.html
  404 页面:    index.html (SPA fallback)

# 前端 API 地址配置
# 修改 frontend/src/services/api.ts 或环境变量中的 baseURL 为 FC_API_BASE_URL
